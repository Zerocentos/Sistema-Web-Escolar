<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Sistema Web Escolar - Novo aluno </title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='alunos.css') }}">
  </head>

  <body id="novo-aluno">
    <header class="cabecalho">
      <h1>Sistema Web Escolar</h1>
    </header>

    <div class="pagina">
      {% if Mensagem %}
        <h3 class="mensagem">{{ Mensagem }}</h3>
      {% else %}
        <form class="forms" method="POST">
          <label for="nome">Nome *:</label>
          <input type="text" id="nome" name="nome" required placeholder="e.g. Eduardo Lamounier">

          <label for="email">Email:</label>
          <input type="text" id="email" name="email" placeholder="e.g. abc123@gmail.com">

          <label for="telefone">Telefone:</label>
          <input type="text" id="telefone" name="telefone" placeholder="e.g. 31 91234-5678">

          <label for="data-nascimento">Data de nascimento *:</label>
          <input type="date" id="data-nascimento" name="data-nascimento" required>

          <div id="cursos">
            <label>Curso *:</label><br>
                  {% for curso in Cursos %}
            <label>
                <input type="radio" name="curso" value="{{ curso[0] }}">
                {{ curso[1] }}
            </label>
            {% endfor %}
          </div>

          <button class="botao" type="submit">Cadastrar aluno</button>
        </form>
      {% endif %}
    </div>
  </body>
</html>
