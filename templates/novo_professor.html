<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title> Sistema Web Escolar - Novo professor </title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='professor.css') }}">
  </head>

  <body id="novo-professor">
    <header class="cabecalho">
      <h1>Sistema Web Escolar</h1>
    </header>

    <div class="pagina">
      {% if Mensagem %}
        <h3 class="mensagem">{{ Mensagem }}</h3>
    
      {% else %}
        <form class="forms" method="POST" 
        action="{{ url_for('editar_professor', id_professor=Professor[0]) if Modo == 'editar' 
                  else url_for('novo_professor')}}">

          <label for="nome"> Nome *: </label>
          <input type="text" id="nome" name="nome" required placeholder="e.g. Fulano Ciclano"
          value="{{ Professor[1] if Professor }}">

          <label for="email"> Email: </label>
          <input type="text" id="email" name="email" placeholder="e.g. exemplo@exemplo.com"
          value="{{ Professor[2] if Professor }}">

          <label for="telefone"> Telefone: </label>
          <input type="text" id="telefone" name="telefone" placeholder="e.g. 31 0000-0000"
          value="{{ Professor[3] if Professor }}">

          <label for="data-nascimento"> Data de nascimento *: </label>
          <input type="date" id="data-nascimento" name="data-nascimento" required
          value="{{ Professor[4] if Professor }}">

          <div id="materias">
            <label> Materias *: </label><br>
                  {% for materia in Materias %}

            <label>
                <input type="radio" name="materia" value="{{ materia[0] }}"  
                {% if Professor and materia[0] == Professor[5]  %} checked {% endif %}>
                {{ materia[1] }}
            </label>

            {% endfor %}
          </div>

          <button class="botao" type="submit"> Cadastrar professor </button>
        </form>
      {% endif %}

    </div>
  </body>
</html>
