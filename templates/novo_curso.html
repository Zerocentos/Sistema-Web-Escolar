<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Sistema Web Escolar - Novo curso </title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='cursos.css' )}}">
  </head>

  <body id="novo-curso">
    <header class="cabecalho">
      <h1>Sistema Web Escolar</h1>
    </header>

    <div class="pagina">
      {% if Mensagem %}
        <h3 class="mensagem">{{ Mensagem }}</h3>
      {% else %}
        <form class="forms" method="POST">
          <label for="nome">Nome do curso:</label>
          <input type="text" id="nome" name="nome" required placeholder="e.g. Eletrônica">

          <label for="descricao">Descrição:</label>
          <input type="text" id="descricao" name="descricao" required placeholder="Fale sobre o curso!">

          <div id="materias">
            <label>Matérias:</label><br>
                  {% for materia in Materias %}
            <label>
                <input type="checkbox" name="materias" value="{{ materia[0] }}">
                {{ materia[1] }}
            </label>
            {% endfor %}
          </div>

          <button class="botao" type="submit">Cadastrar Curso</button>
        </form>
      {% endif %}
    </div>
  </body>
</html>
