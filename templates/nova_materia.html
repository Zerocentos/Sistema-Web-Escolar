<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Sistema Web Escolar - Nova matéria </title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='materias.css' )}}"
  </head>

  <body id="nova-materia">
    <header class="cabecalho">
      <h1>Sistema Web Escolar</h1>
    </header>

    <div class="pagina">
      {% if Mensagem %}
        <h3 class="mensagem">{{ Mensagem }}</h3>
      {% else %}
        <form class="forms" method="POST"> 
          <label for="nome">Nome da Matéria:</label>
          <input type="text" id="nome" name="nome" required placeholder="e.g. Matemática">

          <label for="carga-horaria">Carga Horária (horas):</label>
          <input type="number" id="carga-horaria" name="carga_horaria" min="1" required placeholder="e.g. 80">

          <button class="botao" type="submit">Cadastrar Matéria</button>
        </form>
      {% endif %}
    </div>
  </body>
</html>
